# Digit Robot Configuration File
# Created: 2026-01-06
# This file contains all robot-specific parameters for the Digit biped robot

# ============================================================================
# ROBOT IDENTIFICATION
# ============================================================================
robot_name: "Digit"

# ============================================================================
# ROBOT MODEL CONFIGURATION
# ============================================================================
model:
  # Path to robot model file
  model_path: "../digit_mujoco-main/src/digit_mujoco/models/flat/digit-v3-flat.xml"
  
  # Model format: "urdf" or "mjcf"
  format: "mjcf"

# ============================================================================
# ROBOT STRUCTURE
# ============================================================================
structure:
  # Number of legs/contact points
  num_legs: 2
  
  # Contact point frame IDs in the Pinocchio model - size should match num of legs
  # For Digit: Left foot=31, Right foot=71
  contact_frame_ids: [31, 71]

# ============================================================================
# IMU2BD Frame ID of the IMU in the Pinocchio model - select from the frames in the URDF (run
# getParameters() to print out frame names and indices) - this is the frame that provides the IMU measurements
# ============================================================================
imuFrame_id: 1

# ============================================================================
# COVARIANCE PARAMETERS for the Robot
# ============================================================================
covariance:
  # Sensor noise covariances
  gyro: 1.0e-4
  accelerometer: 1.0e-2
  encoder: 1.0e-4
  
  # Contact estimation covariances
  contact: 1.0e-6
  slip: 1.0e-3
  
  # Bias covariances
  bias_gyro: 1.0e-6
  bias_accelerometer: 1.0e-6
  
  # Prior covariances
  prior_orientation: 1.0e-3
  prior_velocity: 1.0e-3
  prior_position: 1.0e-3
  prior_bias_gyro: 1.0e-6
  prior_bias_accelerometer: 1.0e-6

# ============================================================================
# ENCODER MAPPING
# ============================================================================
# Indices of encoder and encoderdot that receive actual TextFile data or sensor data (non-zero assignments)
# Got to put some work into finding these indices for your robot

Encoder_indices_map: [7, 8, 9, 14, 15, 16, 17, 18, 23, 28, 29,    34, 35, 36, 41, 42, 43, 44, 45, 50, 55, 56]
Encoderdot_indices_map: [6, 7, 8, 12, 13, 14, 15, 16, 20, 24, 25,   30, 31, 32, 36, 37, 38, 39, 40, 44, 48, 49]

  
