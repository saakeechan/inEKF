    # ------------------------------------------------------------
# USER CONFIGURABLE PARAMETERS
# ------------------------------------------------------------

# Estimator parameters
sliding_window_size: 2
dt: 0.02
kinematics_mode: pkm # vkm is kinda broken, dont use

# TextFile data file configuration
textfile:
  enabled: true # Set to true to use TextFile data, false to use sensor data
  file_name: "../splitData/robotstate_0_env6_run2.csv"
  start_count: 0 # Number of initial data points to skip in TextFile
  end_count: 999 # End of data points to read from TextFile (inclusive)
  save_results: false  # Whether to save estimation results to a file
  saved_results_folder: "../results"  # Name of the folder to save estimation results


# Slip rejection configuration
slip_rejection:
  enabled: false  # Slip rejection mode
  threshold: 0.3  # Slip threshold in m/s

# Variable contact covariance configuration
variable_contact_covariance:
  enabled: false  # Variable contact covariance mode
  amplifier: 1.0  # Multiplied to contact covariance when VCC is enabled

Contact_estimation_NN:
  enabled: false  # Live inputs: true = NN, false = model-based; CSV uses recorded contacts
  file_path: "../src/contactDetection/model_final_epoch.onnx"  # Path to the ONNX contact estimation model


# Estimator Covariances (exponents for 10^x) Overrides robot defaults here
# Order: gyro, acc, slip, contact, encoder, bias_gyro, bias_acc,
#        prior_ori, prior_vel, prior_pos, prior_bias_gyro, prior_bias_acc

covariance_exponents:
  gyro: -6
  acc: -2
  slip: 0
  contact: -4
  encoder: -8
  bias_gyro: -10
  bias_acc: -10
  prior_orientation: -10
  prior_velocity: -10
  prior_position: -10
  prior_bias_gyro: -10
  prior_bias_acc: -10


# Initial condition (16-dimensional state vector) (Acts like Noise when csv enabled)
initial_condition:
  position: [0.0, 0.0, 0.0]  # Px, Py, Pz
  orientation: [1.0, 0.0, 0.0, 0.0]  # Quaternion (Qw, Qx, Qy, Qz)
  velocity: [0.0, 0.0, 0.0]  # Vx, Vy, Vz
  bias_gyro: [0.0, 0.0, 0.0]  # bgx, bgy, bgz
  bias_acc: [0.0, 0.0, 0.0]  # bax, bay, baz

